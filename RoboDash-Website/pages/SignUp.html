</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container px-4 px-lg-5">
        <a class="navbar-brand fw-bold" href="../index.html" style="color:#2C6E99;">
            RoboDash
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item"><a class="nav-link active" href="SignUp.html">Order</a>
                <li class="nav-item"><a class="nav-link" href="order.html">Order</a></li>
                <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                <li class="nav-item"><a class="nav-link" href="signin.html">Sign In</a></li>

            </ul>
            <form class="d-flex">

                        id="cartBtn"

</nav>

<!-- REGISTER SECTION -->

<div class="container mt-5">

    <h2 class="text-center text-primary mb-4">Create Your RoboDash Account</h2>

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm p-4">

                <form onsubmit="registerUser(event)">

                    <!-- EMAIL -->

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" id="username" class="form-control" required>
                    </div>

                    <!-- PASSWORD -->

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>

                    <!-- CONFIRM PASSWORD -->

                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" id="confirmPassword" class="form-control" required>
                    </div>

                    <!-- BUTTON -->

                    <div class="text-center mt-4">
                        <button class="btn btn-primary rounded-pill px-4">
                            Create Account
                        </button>

                        <p class="text-center mt-3">
                            Already have an account?
                            <a href="signin.html">Sign In</a>
                        </p>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script src="../js/config.js"></script>

<script src="../js/service/user-service.js"></script>

<script>
    function registerUser(event) {

        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirmPassword").value;

        if(password !== confirm){
            alert("Passwords do not match.");
            return;
        }

        userService.register(username, password, confirm);

        alert("Account created! Please sign in.");

        window.location.href = "signin.html";
    }
</script>

</body>
</html>
