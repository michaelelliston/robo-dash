<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="../css/styles.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container px-4 px-lg-5">
        <a class="navbar-brand fw-bold" href="../index.html" style="color:#2C6E99;">RoboDash</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="../pages/order.html">Order</a></li>
                <li class="nav-item"><a class="nav-link" href="../pages/profile.html">Profile</a></li>
                <li class="nav-item"><a class="nav-link" href="Register.html">Sign Up</a></li>
                <li class="nav-item"><a class="nav-link active" href="signin.html">Sign In</a></li>

            <button id="cartBtn" class="btn btn-outline-dark">
                Cart <span class="badge bg-dark text-white ms-1 rounded-pill">0</span>
            </button>
        </div>
    </div>
</nav>


<div class="container mt-5">

    <h2 class="text-center text-primary mb-4">Sign In</h2>

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm p-4">

                <div id="errors" class="text-danger mb-3"></div>

                <form id="loginForm">

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input id="username" type="text" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input id="password" type="password" class="form-control" required>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary rounded-pill px-4">
                            Sign In
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

</div>


<!-- Axios for HTTP requests -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<!-- Project scripts -->
<script src="../js/config.js"></script>
<script src="../js/service/user-service.js"></script>

<script>

    document.addEventListener("DOMContentLoaded", () => {

        const form = document.getElementById("loginForm");

        form.addEventListener("submit", function(event) {

            event.preventDefault(); // prevents page refresh

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if(!username || !password){
                document.getElementById("errors").innerText = "Please enter username and password.";
                return;
            }

            userService.login(username, password);
        });

    });

</script>

</body>
</html>
