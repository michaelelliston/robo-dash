<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RoboDash - Delivery</title>

    <link href="../css/styles.css" rel="stylesheet" />
    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
        #map { height: 70vh; border-radius: 12px; }
    </style>
</head>
<body>
<div class="container px-4 px-lg-5 mt-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="mb-0">Delivery Animation</h2>
        <button id="startBtn" class="btn btn-primary">Start Delivery</button>
    </div>

    <div id="map"></div>
    <div class="mt-3">
        <div><strong>Status:</strong> <span id="status">Idle</span></div>
        <div><strong>ETA:</strong> <span id="eta">—</span></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../js/delivery-animation.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
