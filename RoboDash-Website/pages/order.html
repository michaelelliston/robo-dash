<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>RoboDash - Order</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet"/>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container px-4 px-lg-5">
        <a class="navbar-brand fw-bold" href="../index.html" style="color:#2C6E99;">
            RoboDash
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span
                class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" href="../pages/order.html">Order</a>
                </li>
                <li class="nav-item"><a class="nav-link" href="../pages/Register.html">Sign Up</a></li>
                <li class="nav-item"><a class="nav-link" href="signin.html">Sign In</a></li>
                <li class="nav-item"><a class="nav-link" href="../pages/about-us.html">About Us</a></li>
            </ul>
            <form class="d-flex">
                <button
                        id="cartBtn"
                        class="btn btn-outline-dark"
                        type="button"
                >
                    <i class="bi-cart-fill me-1"></i>
                    Cart
                    <span id="cart-items" class="badge bg-dark text-white ms-1 rounded-pill">0</span>
                </button>
            </form>
        </div>
    </div>
</nav>

<!-- HERO -->
<section class="py-5 text-center" style="background-color:#F4F7FA;">
    <div class="container">
        <h1 class="fw-bold" style="color:#2C6E99;">Order Your Favorites</h1>
        <p class="text-muted">Hot food. Zero wait. Delivered by RoboDash.</p>
    </div>
</section>

<section class="py-5">
    <div class="container">

        <div class="card shadow-sm border-0 rounded-4 p-4 mb-5" style="background-color:#F4F7FA;">
            <div class="row g-3 align-items-center">

                <div class="col-md-4">
                    <label class="form-label fw-semibold">Diet</label>
                    <label for="dietFilter"></label>
                    <select id="dietFilter" class="form-select rounded-pill">
                        <option value="all">All</option>
                        <option value="vegan">Vegan</option>
                        <option value="vegetarian">Vegetarian</option>
                        <option value="non-vegetarian">Non-Vegetarian</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-semibold">Price</label>
                    <label for="priceFilter"></label>
                    <select id="priceFilter" class="form-select rounded-pill">
                        <option value="all">All</option>
                        <option value="0-5">$0–$5</option>
                        <option value="5-10">$5–$10</option>
                        <option value="10-999">$10+</option>
                    </select>
                </div>

                <div class="col-md-4 text-md-end">
                    <button class="btn btn-primary rounded-pill px-4 mt-3 mt-md-0">
                        Apply
                    </button>
                    <button id="resetFilters" class="btn btn-outline-secondary rounded-pill px-4">
                        Reset
                    </button>
                </div>

            </div>
        </div>

        <!-- ================= MEALS ================= -->
        <h2 class="fw-bold text-center mb-5" style="color:#2C6E99;">
            Menu
        </h2>

        <div id="product-list"
             class="row g-4 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">
        </div>

        <footer class="py-4 bg-dark">
            <div class="container text-center text-white">
                Copyright © 2026 RoboDash
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="../js/config.js"></script>
        <script src="../js/service/user-service.js"></script>
        <script src="../js/service/shoppingcart-service.js"></script>
        <script src="../js/service/product-service.js"></script>
        <script src="../js/scripts.js"></script>
        <script>
            document.addEventListener("click", function(e) {

    if (!e.target.classList.contains("add-to-cart")) return;

    const btn = e.target;

    const product = {
        id: Number(btn.dataset.id),
        name: btn.dataset.name,
        price: Number(btn.dataset.price),
        imageUrl: btn.dataset.image
    };

    cartService.addToCart(product);

    console.log("Added to cart:", product);

});
        </script>
        <script>
            document.addEventListener("DOMContentLoaded", () => {

            const buttons = document.querySelectorAll(".add-to-cart");

            buttons.forEach(btn => {

            btn.addEventListener("click", () => {

            const product = {
            id: Number(btn.dataset.id),
            name: btn.dataset.name,
            price: Number(btn.dataset.price),
            imageUrl: btn.dataset.image
            };

            cartService.addToCart(product);

            console.log("Added to cart:", product);
            });

            });

            });
        </script>

        <script>
            function parseRange(rangeStr) {
              if (!rangeStr || rangeStr === "all") return { min: -Infinity, max: Infinity };
              const [min, max] = rangeStr.split("-").map(Number);
              return { min, max };
            }

            function applyFilters() {
              const dietValue = document.getElementById("dietFilter").value;   // all | vegan | vegetarian | non-vegetarian
              const priceValue = document.getElementById("priceFilter").value; // all | "0-10" etc.
              const { min, max } = parseRange(priceValue);

              const items = document.querySelectorAll("[data-menu-item]");
              items.forEach(item => {
                const diet = (item.dataset.diet || "").toLowerCase();
                const price = Number(item.dataset.price);

                const dietMatch = (dietValue === "all") || (diet === dietValue);
                const priceMatch = Number.isFinite(price) && price >= min && price <= max;

                // show/hide by toggling Bootstrap's d-none
                item.classList.toggle("d-none", !(dietMatch && priceMatch));
              });
            }

            function resetFilters() {
              document.getElementById("dietFilter").value = "all";
              document.getElementById("priceFilter").value = "all";
              applyFilters();
            }

            document.addEventListener("DOMContentLoaded", () => {
              document.getElementById("dietFilter").addEventListener("change", applyFilters);
              document.getElementById("priceFilter").addEventListener("change", applyFilters);
              document.getElementById("resetFilters").addEventListener("click", resetFilters);

              applyFilters(); // initial
            });
        </script>

    </div>
</section>
</body>
</html>
